name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PW="$KS_PW"
          else
            PW="ibracastle-ci"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias ibracastle -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=IBRAPROGRAM, C=IQ"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$PW" >> $GITHUB_ENV
          echo "KEY_ALIAS=ibracastle" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$PW" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk IBRA-CASTLE-AR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-CASTLE-AR-android
          path: IBRA-CASTLE-AR.apk
