name: iOS IPA

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project IbraCastle.xcodeproj -scheme IbraCastle -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60
          test -d build/Build/Products/Release-iphoneos/IbraCastle.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/IbraCastle.app Payload/
          zip -qry IBRA-CASTLE-AR.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-CASTLE-AR-ios
          path: IBRA-CASTLE-AR.ipa

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IBRA-CASTLE-AR.ipa
          name: "IBRA CASTLE AR ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
