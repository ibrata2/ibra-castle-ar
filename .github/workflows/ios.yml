name: iOS IPA

on:
  push:
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project IbraCastle.xcodeproj -scheme IbraCastle -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -30 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -20 || true
          test -d build/Build/Products/Release-iphoneos/IbraCastle.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          ditto "$(cd ios/build/Build/Products/Release-iphoneos && pwd -P)/IbraCastle.app/" Payload/IbraCastle.app/ || \
            cp -RL ios/build/Build/Products/Release-iphoneos/IbraCastle.app Payload/
          ls -la Payload/IbraCastle.app | head -20
          test -f Payload/IbraCastle.app/IbraCastle
          zip -qr IBRA-CASTLE-AR.ipa Payload
          ls -la IBRA-CASTLE-AR.ipa
          test $(stat -f%z IBRA-CASTLE-AR.ipa) -gt 100000

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-CASTLE-AR-ios
          path: IBRA-CASTLE-AR.ipa

