name: IbraCastle
options:
  bundleIdPrefix: com.ibraprogram
  deploymentTarget:
    iOS: "15.0"
targets:
  IbraCastle:
    type: application
    platform: iOS
    sources: [IbraCastle]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibraprogram.castlear
        PRODUCT_NAME: IbraCastle
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: IbraCastle/Info.plist
      properties:
        CFBundleDisplayName: IBRA CASTLE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "اللعبة تحتاج الكاميرا حتى تضع القلعة على الطاولة بالواقع المعزز"
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        CFBundleDevelopmentRegion: ar
